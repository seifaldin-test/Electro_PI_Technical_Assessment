name: Electro PI Technical Assessment QA Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  api-tests:
    name: API Tests (Newman)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Postman API Collection
        run: npm run test:api

      - name: Upload API Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-html-report
          path: reports/api-report.html
          retention-days: 14

  ui-tests:
    name: UI Tests (Playwright)
    needs: api-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Execute UI Suite
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Running PR Smoke Suite..."
            npm run test:ui:smoke
          else
            echo "Running Full Regression Suite..."
            npm run test:ui:regression
          fi

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30